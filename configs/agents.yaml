# CallVerse Agents Configuration
# Four cooperating agents (Client, Advisor, Quality, Workforce) orchestrated by LangGraph.

llm:
  # Where the models run (CALLVERSE_LLM_PROVIDER overrides):
  #   openrouter:   hosted open models through the OpenRouter API (free tier; needs
  #                 OPENROUTER_API_KEY in .env). The local models below are the backup
  #                 when the key is missing, the daily quota is used up or the API fails.
  #   transformers: only the local models (zero cost per call, no data leaves the machine).
  provider: openrouter
  openrouter:
    base_url: https://openrouter.ai/api/v1
    # Free variants: 20 requests/minute; 50/day, or 1,000/day once $10 of credits were bought.
    # Per role: the first model, then fallbacks OpenRouter tries in the same request when it
    # is busy. Chosen after a trial on 2026-11-03 (reasoning off): Nemotron 3.5 Super and
    # Lightning called lookup_order with the right order number in ~1.5 s; Xing 4.0 returned
    # a complete judge scorecard; the free Gemma 4 endpoints were rate limited upstream.
    # The judge stays in another family than the advisor (NVIDIA), so it grades fairly.
    models:
      advisor: [nvidia/nemotron-3.5-super-vl:free, nvidia/nemotron-3.5-lightning:free]
      client: [nvidia/nemotron-3.5-lightning:free, google/gemma-4-26b-a4b-it:free]
      judge: [xingchen-agi/xing4.0-29b-a4b:free, google/gemma-4-26b-a4b-it:free]
    # Answer directly: reasoning models could spend the whole token budget "thinking"
    # (the judge returned empty answers with reasoning on).
    reasoning: {enabled: false}
    timeout_seconds: 60
    max_retries: 2                # a busy free model (HTTP 429 per minute, 5xx) is retried twice
    cooldown_seconds: 60          # then the role rests for a minute and the local backup answers
    min_interval_seconds: 3.1     # at most ~20 requests per minute
  # Local backup: open-weight models from the Hugging Face Hub, run with `transformers`.
  # `callverse llm-pull` downloads them once and pins each repository's commit in
  # artifacts/traces/llm_models.lock.json.
  # auto: use the local models when they can run (CUDA GPU + weights downloaded),
  # otherwise the offline backups (templates and rule-based judge).
  # on: fail if a model cannot run. off: always use the backups.
  mode: auto
  device: auto                # auto | cuda | cpu (CALLVERSE_LLM_DEVICE overrides)
  # temperature 0.2: answers vary little (0 would always pick the most likely next word).
  temperature: 0.2
  seed: 42                    # fixed seed: same prompt + same model = same answer
  cache: true                 # identical calls are answered from artifacts/traces/llm_cache.sqlite
  # Longest answer each role may write, in tokens (a token is about 3/4 of a word).
  max_new_tokens: {client: 160, advisor: 320, judge: 256}
  # The judge is from a DIFFERENT family and organisation than the advisor
  # (IBM Granite vs Hugging Face SmolLM3), so it does not share its blind spots.
  # Profiles (CALLVERSE_LLM_PROFILE overrides):
  #   gpu4gb: 4-bit weights; advisor + client share one 3B model, 1.6B judge.
  #           ~3.2 GB of VRAM in total: fits a 4 GB laptop GPU (GTX 1650).
  #   full:   the same families in full precision, for a GPU with >= 12 GB.
  profile: gpu4gb
  profiles:
    gpu4gb:
      client: unsloth/SmolLM3-3B-bnb-4bit      # plays the customer
      advisor: unsloth/SmolLM3-3B-bnb-4bit     # same weights, loaded once
      judge: unsloth/granite-4.0-1b-bnb-4bit   # grades the conversation
    full:
      client: HuggingFaceTB/SmolLM3-3B
      advisor: HuggingFaceTB/SmolLM3-3B
      judge: ibm-granite/granite-4.0-1b
  # Fallback chain when a pinned model is not downloaded
  fallbacks:
    advisor: [HuggingFaceTB/SmolLM3-3B]
    client: [HuggingFaceTB/SmolLM3-3B]
    judge: [ibm-granite/granite-4.0-1b]
  # Model cards (shown in the back office) and chat-template options
  catalog:
    nvidia/nemotron-3.5-super-vl:free:
      family: Nemotron 3.5 (NVIDIA)
      parameters: 120B (12B active, mixture of experts)
      hosting: OpenRouter, free tier
    nvidia/nemotron-3.5-lightning:free:
      family: Nemotron 3.5 (NVIDIA)
      parameters: 30B (3B active, mixture of experts)
      hosting: OpenRouter, free tier
    xingchen-agi/xing4.0-29b-a4b:free:
      family: Xing 4.0 (China Telecom TeleAI)
      parameters: 29B (4B active, mixture of experts)
      hosting: OpenRouter, free tier
    google/gemma-4-26b-a4b-it:free:
      family: Gemma 4 (Google)
      parameters: 26B (4B active, mixture of experts)
      hosting: OpenRouter, free tier
    unsloth/SmolLM3-3B-bnb-4bit:
      base_model: HuggingFaceTB/SmolLM3-3B
      family: SmolLM3 (Hugging Face)
      parameters: 3.1B
      license: apache-2.0
      quantization: 4-bit NF4 (bitsandbytes)
      chat_template_kwargs: {enable_thinking: false}   # no hidden reasoning: faster replies
      tools_kwarg: xml_tools                            # SmolLM3's template lists tools this way
    HuggingFaceTB/SmolLM3-3B:
      base_model: HuggingFaceTB/SmolLM3-3B
      family: SmolLM3 (Hugging Face)
      parameters: 3.1B
      license: apache-2.0
      chat_template_kwargs: {enable_thinking: false}
      tools_kwarg: xml_tools
    unsloth/granite-4.0-1b-bnb-4bit:
      base_model: ibm-granite/granite-4.0-1b
      family: Granite 4.0 (IBM)
      parameters: 1.6B
      license: apache-2.0
      quantization: 4-bit NF4 (bitsandbytes)
    ibm-granite/granite-4.0-1b:
      base_model: ibm-granite/granite-4.0-1b
      family: Granite 4.0 (IBM)
      parameters: 1.6B
      license: apache-2.0

client:
  # Persona profiles of the simulated customers (twin input).
  # patience_multiplier scales the mean patience of configs/simulation.yaml.
  personas:
    impatient: {share: 0.25, patience_multiplier: 0.5, tone: "short, irritated, wants a fast answer"}
    normal:    {share: 0.55, patience_multiplier: 1.0, tone: "polite and direct"}
    patient:   {share: 0.20, patience_multiplier: 2.0, tone: "calm, friendly, gives details"}
  # A repeat contact on the same order is more likely impatient (CRM signal).
  repeat_contact_impatient_share: 0.6
  max_turns: 4                # customer messages per conversation, at most

advisor:
  # Agentic RAG: Ask -> Retrieve -> LLM (+ tools) -> Reply
  # variant rag_policy: the LLM also calls the company rules engine (recommend_resolution);
  # variant rag: pure agentic RAG (ablation).
  # variant agentic: the LLM chooses its tools (at most 5 offered per stage), the rules
  #   engine still decides, safety nets call what the LLM forgot, every draft is fact-checked.
  variant: rag_policy
  # How the LLM's tools are reached: mcp = the Advisor discovers them (tools/list) and calls them
  # (tools/call) through the CallVerse MCP server (src/callverse/mcp/); direct = plain Python calls.
  # The results are the same; mcp is the standard way any AI app can reach the same tools.
  tool_transport: mcp
  # max_tool_rounds: how many times the LLM may call tools before it must answer. retrieval_top_k:
  # knowledge-base sections given to the LLM.
  max_tool_rounds: 4
  retrieval_top_k: 3
  # External API of the validate_bank_code tool: Brazilian bank codes from BrasilAPI,
  # downloaded once and cached (one call takes 1-5 s; the cache is fast, offline, repeatable).
  bank_directory:
    url: https://brasilapi.com.br/api/banks/v1
    cache_file: data/external/brasilapi_banks.json
    timeout_seconds: 8
  # Backup (DSO2): intent classifier + approved templates filled with order facts.
  intent_classifier:
    model: tfidf_logreg
    test_size: 0.2
    random_seed: 42
  # Knowledge retrieval index settings, chunking, and prompt templates
  knowledge_base:
    version: 1
    docs_dir: data/knowledge_base/docs      # hand-written Markdown, tracked in git
    index_dir: data/knowledge_base/index    # built by scripts/build_knowledge_base.py
    # bge-m3: multilingual (FR + EN), 1024-dim dense vectors, runs locally on CPU.
    embedding_model: BAAI/bge-m3
    embedding_device: cpu      # keeps the GPU for the LLMs
    embedding_batch_size: 16
    max_seq_length: 512        # chunks are short sections; 512 tokens is plenty
    # One chunk per "##" section. Longer sections are split on paragraphs.
    max_chunk_chars: 1500
    # Exact cosine search (FAISS IndexFlatIP on normalised vectors): the corpus is
    # ~70 chunks, so approximate indexes would only add error.
    top_k: 4
    min_score: 0.0             # chunks scoring below this are dropped
    # Below this top-1 cosine score the advisor should answer "no answer in the
    # knowledge base". Calibrated in notebook 11: keeps 95.5% of covered questions,
    # rejects all clearly unrelated ones (password, account, app).
    no_answer_score: 0.57

quality:
  # Scorecard (1 = very poor, 5 = excellent), filled by the judge for every conversation.
  rubric:
    compliance: "The advisor followed company policy (verified the order, gave the policy-correct action and timing, no invented promises)."
    relevance: "The answer addressed the customer's actual request using the order facts."
    satisfaction: "How satisfied the customer most likely is at the end of the chat."
    sentiment: "Mood of the customer at the end (1 = angry, 3 = neutral, 5 = happy)."
    resolution: "The problem was solved in the conversation (5) or correctly handed over with a clear next step (3)."
  # Calibration: agreement with human grades (DSO2). Below this kappa the judge is not trusted.
  min_quadratic_kappa: 0.4
  human_labels_file: data/labels/human_quality_labels.csv
  calibration_sample_size: 60

workforce:
  routing:
    # MaskablePPO routing agent (DSO1, idea A). The agent that becomes free chooses
    # one of the K oldest waiting contacts.
    queue_slots: 10
    abandon_penalty_seconds: 600   # one abandonment costs as much as 10 minutes of waiting
    # Rewards are divided by this number, to keep them small for the neural network.
    reward_scale_seconds: 600
    train_period: {start: 2017-02-01, end: 2018-03-31}   # days the agent practises on
    test_period: {start: 2018-04-01, end: 2018-08-19}    # never seen during training
    load_multiplier: {low: 1.0, high: 1.8}  # training days are made busier than planned (peaks)
    group_surge: [1.0, 1.6]                # and each problem type surges on its own (promo, delays)
    absence_rate: {low: 0.05, high: 0.30}   # and some planned agents are absent
    backlog_wait_weight: 0.1               # overnight messages count less than live chats
    # PPO training settings (stable-baselines3): total_timesteps = decisions practised; n_steps = steps
    # collected before each update; gamma = how much future waiting counts (close to 1 = long-term view);
    # ent_coef = small bonus for trying new actions; net_arch = two hidden layers of 128 neurons.
    ppo:
      total_timesteps: 300000
      n_steps: 2048
      batch_size: 256
      learning_rate: 0.0003
      gamma: 0.995
      ent_coef: 0.01
      net_arch: [128, 128]
      seed: 42
    # Backup (DSO1): priority score with weights found by random search in the twin
    skill_score:
      search_iterations: 40
      search_days: 6
      default_weights: {wait: 1.0, speed: 1.0, short_job: 0.5, impatient: 0.5}
  scheduling:
    # CP-SAT shift planning (DSO3, idea B), driven by the forecast.
    shift_lengths_hours: [4, 6, 8]
    max_days_per_week: 5
    max_regular_hours_per_week: 40
    min_rest_hours: 11
    max_overtime_agents_per_hour: 4
    max_overtime_hours_per_week: 60
    headcount: auto                 # auto = enough agents for the peak hour + rest days
    understaffing_penalty_eur: 200  # per missing agent-hour; makes coverage nearly hard
    solver_time_limit_seconds: 20
    random_seed: 42
    # Baseline: the same number of agents every open hour, no overtime logic, sized
    # for the busiest hour of the week (what a manager does without a planner).
    fixed_schedule_quantile: 1.0
    # Sensitivity: a "tuned" fixed schedule that accepts some understaffed hours.
    fixed_tuned_quantile: 0.75
    # Backup: Erlang C + 3 shift templates + real-time overtime rule
    rule_templates:
      morning: [8, 16]
      afternoon: [14, 22]
    overtime_rule:
      queue_threshold: 8            # contacts waiting at the top of an hour
      extra_agents: 2               # called in for that hour, paid as overtime
