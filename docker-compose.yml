# One-command deploy of CallVerse:
#   docker compose up --build
#     front office (customers + advisors)  http://localhost:8080
#     back office  (managers' control room) http://localhost:8081
#     API (FastAPI + WebSocket, Swagger)    http://localhost:8000/docs
#     MLflow                                http://localhost:5000
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#     same, with the local Hugging Face LLMs on an NVIDIA GPU (NVIDIA Container Toolkit).
# Without a GPU the agents use their offline backups (templates + rule-based judge).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow}
      POSTGRES_DB: mlflow
    volumes:
      - mlflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      retries: 10

  mlflow:
    image: python:3.11-slim
    command: >
      sh -c "pip install --no-cache-dir mlflow==3.17.1 psycopg2-binary &&
             mlflow server --host 0.0.0.0 --port 5000
             --backend-store-uri postgresql://mlflow:${MLFLOW_DB_PASSWORD:-mlflow}@postgres:5432/mlflow
             --artifacts-destination /mlartifacts --serve-artifacts"
    ports: ["5000:5000"]
    volumes:
      - mlflow-artifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: [.env]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./configs:/app/configs
      - hf-cache:/root/.cache/huggingface   # bge-m3 + the agents' LLMs (callverse llm-pull)
    depends_on: [mlflow]

  # Both React apps, served by one nginx (8080 front office, 8081 back office);
  # /api and /ws are proxied to the API, so each app talks to a single origin.
  web:
    build: ./frontend
    ports: ["8080:8080", "8081:8081"]
    depends_on: [api]

volumes:
  mlflow-db:
  mlflow-artifacts:
  hf-cache:
