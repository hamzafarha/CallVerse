# Front office
server {
  listen 8080;
  root /usr/share/nginx/front-office;

  # Calls to /api, /docs, /openapi.json and /ws (WebSocket) go to the API container; long timeouts for slow
  # LLM answers.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_read_timeout 600s;
  }
  location /docs { proxy_pass http://api:8000; }
  location /openapi.json { proxy_pass http://api:8000; }
  # WebSocket: the Upgrade headers switch the HTTP connection to a WebSocket.
  location /ws/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 600s;
  }
  # Any other path returns index.html, so React Router can show the right page (single-page app).
  location / {
    try_files $uri /index.html;
  }
}

# Back office
server {
  listen 8081;
  root /usr/share/nginx/back-office;

  # Same proxy rules as the front office.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_read_timeout 600s;
  }
  location /docs { proxy_pass http://api:8000; }
  location /openapi.json { proxy_pass http://api:8000; }
  location /ws/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 600s;
  }
  # Any other path returns index.html (single-page app).
  location / {
    try_files $uri /index.html;
  }
}
