# How the package is built: hatchling turns src/callverse into an installable Python package.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Package name, version, and the Python versions it supports.
[project]
name = "callverse"
version = "1.1.0"
description = "Multi-agent digital twin of an e-commerce customer service center"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Hamza Farhani" },
]
# Core: data layer, simulation, KPI engine, API. Enough to run the twin with the
# offline (template / rule-based) agents.
dependencies = [
    "numpy>=1.26,<2.3",
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "scipy>=1.11",
    "pyyaml>=6",
    "pydantic>=2.5",
    "typer>=0.12",
    "simpy>=4.1",
    "scikit-learn>=1.4",
    "pandera>=0.20",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "matplotlib>=3.8",
]

# Extra groups, installed on demand, e.g. pip install -e ".[all]".
[project.optional-dependencies]
# Forecasting models (DSO4)
forecast = [
    "lightgbm>=4.3",
    "statsmodels>=0.14",
    "prophet>=1.1",
]
# Agents: local Hugging Face LLMs (4-bit on a CUDA GPU), RAG embeddings, LangGraph
# orchestration, RL routing, CP-SAT scheduling. For the GPU, install torch from the
# CUDA index first (docs/RUN_GUIDE.md).
agents = [
    "torch>=2.2",
    "transformers>=4.56",
    "accelerate>=1.0",
    "bitsandbytes>=0.45; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "langgraph>=0.2",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",
    "ortools>=9.10",
]
# Experiment tracking and the headless notebook runner
mlops = [
    "mlflow>=2.12",
    "nbclient>=0.10",
    "nbformat>=5.9",
    "ipykernel>=6.29",
]
# Optional LLM tracing backend (local JSONL tracing works without it)
tracing = ["langfuse>=2.0"]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "import-linter>=2.0",
    "types-PyYAML",
]
all = ["callverse[forecast,agents,mlops,dev]"]

# The `callverse` command = the Typer app in src/callverse/main.py (callverse data, forecast, serve...).
[project.scripts]
callverse = "callverse.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/callverse"]

# ruff: the linter and import sorter. E = style errors, F = real errors (unused imports, undefined names), I =
# import order.
[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

# mypy: optional static type checking settings.
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["callverse"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# pytest: where the tests are, and markers to select them (pytest -m "not llm" skips the tests that need a
# real LLM).
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: trains or simulates for more than a few seconds",
    "llm: needs the local Hugging Face models (CUDA GPU, `callverse llm-pull`)",
]
filterwarnings = ["ignore::DeprecationWarning"]

# import-linter (run by `lint-imports`): checks the architecture layers described below.
[tool.importlinter]
root_package = "callverse"

# Layers, from bottom to top:
# config/llm -> data -> forecasting/simulation -> agents -> twin -> orchestration
# -> evaluation -> api. A layer never imports a layer above it.
[[tool.importlinter.contracts]]
name = "Data layer isolation"
type = "forbidden"
source_modules = ["callverse.data"]
forbidden_modules = [
    "callverse.forecasting",
    "callverse.simulation",
    "callverse.agents",
    "callverse.twin",
    "callverse.orchestration",
    "callverse.evaluation",
    "callverse.api",
]

[[tool.importlinter.contracts]]
name = "Simulation layer isolation"
type = "forbidden"
source_modules = ["callverse.simulation", "callverse.forecasting"]
forbidden_modules = [
    "callverse.agents",
    "callverse.twin",
    "callverse.orchestration",
    "callverse.evaluation",
    "callverse.api",
]

[[tool.importlinter.contracts]]
name = "Agents layer allowed imports"
type = "forbidden"
source_modules = ["callverse.agents"]
forbidden_modules = [
    "callverse.twin",
    "callverse.orchestration",
    "callverse.evaluation",
    "callverse.api",
]

[[tool.importlinter.contracts]]
name = "Twin layer allowed imports"
type = "forbidden"
source_modules = ["callverse.twin"]
forbidden_modules = [
    "callverse.orchestration",
    "callverse.evaluation",
    "callverse.api",
]

[[tool.importlinter.contracts]]
name = "Evaluation never calls the API"
type = "forbidden"
source_modules = ["callverse.evaluation", "callverse.orchestration"]
forbidden_modules = ["callverse.api"]
