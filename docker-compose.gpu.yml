# GPU override: CUDA build of torch + the NVIDIA GPU for the local Hugging Face LLMs.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
services:
  api:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu126
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
